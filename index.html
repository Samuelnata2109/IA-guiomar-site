<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("ds-guiomar-theme");
        } catch {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <style>
      html {
        background: #050b14;
      }
      html[data-theme="light"] {
        background: #f0f5fb;
      }
    </style>
    <meta name="theme-color" content="#050b14" />
    <meta
      name="description"
      content="Conheça o curso técnico em Inteligência Artificial da EEEP Guiomar Belchior Aguiar, em Cariré–CE. Explore como a IA aprende com dados e como criar soluções inteligentes com criatividade e responsabilidade."
    />
    <link rel="preload" as="image" href="./assets/hero.webp" />
    <title>Inteligência Artificial — Curso Técnico • Guiomar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
